name: Staging Build & Preview

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  staging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # node 24 matches the committed package-lock.json (npm 11). node 22's
          # npm 10 re-resolves the vitest/esbuild subtree and fails `npm ci`.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build (staging)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_AZURE_CLIENT_ID: ${{ secrets.VITE_AZURE_CLIENT_ID }}
          VITE_AZURE_TENANT_ID: ${{ secrets.VITE_AZURE_TENANT_ID }}
          VITE_REDIRECT_URI: ${{ secrets.VITE_REDIRECT_URI }}
          VITE_PHI_ENCRYPTION_KEY: ${{ secrets.VITE_PHI_ENCRYPTION_KEY }}
          VITE_SUPER_ADMIN_PASSWORD: ${{ secrets.VITE_SUPER_ADMIN_PASSWORD }}
          VITE_DEFAULT_USER_PASSWORD: ${{ secrets.VITE_DEFAULT_USER_PASSWORD }}

      # Same artifact as production: the move notice, not the Vite bundle.
      # The summary below used to read dist/assets, which this site no longer emits.
      - name: Publish retirement redirect
        run: node scripts/publish-redirect.mjs

      - name: Confirm staging artifact is the redirect
        run: node scripts/verify-redirect-dist.mjs

      - name: Upload staging artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-build-${{ github.event.pull_request.number || github.run_id }}
          path: dist/
          retention-days: 7

      - name: Post build summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            function listFiles(dir, prefix = '') {
              return fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
                const rel = prefix ? `${prefix}/${entry.name}` : entry.name;
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) return listFiles(full, rel);
                const stats = fs.statSync(full);
                return [`| ${rel} | ${(stats.size / 1024).toFixed(1)} KB |`];
              });
            }

            const index = fs.readFileSync('dist/index.html', 'utf8');
            const dest = 'https://tristar-reimbursement.vercel.app';
            const isRedirect = index.includes(`content="5; url=${dest}"`)
              && !/<script\b/i.test(index)
              && !fs.existsSync('dist/assets');
            if (!isRedirect) {
              core.setFailed('Staging dist is not the rcalc retirement redirect.');
              return;
            }

            const body = [
              '## Staging Build Summary',
              '',
              '| Status | Result |',
              '|--------|--------|',
              '| Lint | Passed |',
              '| Tests | Passed |',
              '| Build | Retirement redirect |',
              '',
              `The artifact redirects to ${dest} after 5 seconds. The calculator bundle is not included.`,
              '',
              '### Artifact files',
              '| File | Size |',
              '|------|------|',
              listFiles('dist').join('\n'),
              '',
              'Staging artifact available for download from this workflow run.',
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
